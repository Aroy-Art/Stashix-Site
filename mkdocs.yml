site_name: Stashix
site_url: https://stashix.org/
site_description: Self-hosted comic book and ebook library server.
repo_url: https://github.com/aroy-art/stashix
repo_name: aroy-art/stashix
edit_uri: ''

theme:
  name: material
  custom_dir: overrides
  logo: assets/icons/logo.svg
  favicon: assets/icons/logo.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Get Started: get-started/index.md
  - User Guide: user/index.md
  - Admin Guide: admin/index.md
  - Reference: reference/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aroy-art/stashix
      name: Stashix on GitHub
