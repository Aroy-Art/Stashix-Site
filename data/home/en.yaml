sections: [hero, metrics, cards, command-box, cta]

hero:
  align: start
  title_lines:
    - "Ready to start your next reading binge?"
  lead: Self-hosted comic book library. CBZ, CBR and CB7 — an in-browser reader, automatic metadata matching, full-text search, and folder watching. Your collection, your server.
  actions:
    - { label: Get started, url: docs/get-started/, icon: fa-solid fa-rocket, style: primary }
    - { label: View on GitHub, url: "https://github.com/aroy-art/stashix", icon: fa-brands fa-github, style: ghost, external: true }
  slideshow:
    - images/hero/hero-home.png
    - images/hero/hero-reader.png
  media:
    ratio: 1fr 1.2fr

metrics:
  class: sx-band
  columns: 4
  items:
    - { value: 3, label: Comic formats, desc: "CBZ · CBR · CB7" }
    - { value: 2, label: Metadata schemas, desc: "ComicInfo.xml · MetronInfo.xml, matched against Metron · Comic Vine · GCD" }
    - { value: 5, suffix: s, label: To auto-import, desc: new files in watched folders }
    - { value: 100, suffix: "%", label: Free & open source, desc: AGPL-3.0 }

cards:
  eyebrow: Features
  title: Everything your shelf needs
  desc: A reader, metadata, search and sharing for comics and manga.
  class: sx-features
  columns: 3
  items:
    - title: Read in the browser
      desc: A built-in reader for comics and manga. Your place is saved on every page.
      icon: fa-solid fa-book-open
    - title: Folder watching
      desc: Drop a file into a watched folder and it shows up in your library on its own.
      icon: fa-solid fa-eye
    - title: Series & issue matching
      desc: Identifies every series and issue against Metron, Comic Vine and GCD, then fills in credits, summaries and story arcs. Unclear matches wait in a review queue.
      icon: fa-solid fa-tags
    - title: Full-text search
      desc: Search titles, series and publishers across the whole library.
      icon: fa-solid fa-magnifying-glass
    - title: Users & age-gates
      desc: Admin and user roles with per-library permissions and age ratings.
      icon: fa-solid fa-user-shield
    - title: Install it like an app
      desc: A progressive web app you can add to your Android home screen.
      icon: fa-solid fa-mobile-screen

command-box:
  class: sx-quickstart
  eyebrow: Quick start
  title: Up and running in minutes
  lang: bash
  code: |
    cp .env.example .env   # set secrets and LIBRARIES_PATH
    docker compose up -d   # then open http://localhost:4000
  note: A setup wizard runs on first launch. See the [installation guide](docs/get-started/installation/).

cta:
  class: sx-cta
  title: Start your next reading binge
  desc: Self-hosted, free and open source. Bring your own CBZ, CBR or CB7 collection.
  actions:
    - { label: Get started, url: docs/get-started/, icon: fa-solid fa-rocket, style: primary }
    - { label: View on GitHub, url: "https://github.com/aroy-art/stashix", icon: fa-brands fa-github, style: ghost, external: true }
