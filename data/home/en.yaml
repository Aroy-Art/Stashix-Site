sections: [hero, cards, cta]

hero:
  align: center
  eyebrow: Self-hosted comic & ebook library
  title_lines:
    - words: [{ text: Your collection. }]
    - words: [{ text: Your server. }]
  lead: Stashix is a self-hosted library server for comics, manga, and ebooks. Built with Elixir and Phoenix LiveView.
  actions:
    - { label: Get started, url: docs/get-started/, icon: fa-solid fa-rocket, style: primary }
    - { label: Read the docs, url: docs/, icon: fa-solid fa-book, style: ghost }

cards:
  eyebrow: Everything you need
  title: Ship your own shelf
  columns: 3
  items:
    - title: User Guide
      desc: Browse your library, use the in-browser reader, manage your account.
      icon: fa-solid fa-book-open
      url: docs/
    - title: Admin Guide
      desc: Set up libraries, manage users, configure permissions and age-gate controls.
      icon: fa-solid fa-screwdriver-wrench
      url: docs/admin/
    - title: Release Notes
      desc: Stay up to date with new features, fixes, and breaking changes.
      icon: fa-solid fa-bullhorn
      url: blog/

cta:
  title: Ready to run Stashix?
  text: Deploy with Docker in minutes. Bring your own CBZ, CBR, PDF, or EPUB collection.
  label: Get started
  url: docs/get-started/
  style: primary
