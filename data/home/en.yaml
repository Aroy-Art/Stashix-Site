sections: [hero, cards, cta]

hero:
  align: start
  title_lines:
    - "Ready to start your"
    - "next reading binge?"
  lead: Self-hosted comic book and ebook library. CBZ, CBR, CB7, PDF and EPUB — in-browser readers, full-text search, and folder watching. Your collection, your server.
  actions:
    - { label: Get started, url: docs/get-started/, icon: fa-solid fa-rocket, style: primary }
    - { label: View on GitHub, url: "https://github.com/aroy-art/stashix", icon: fa-brands fa-github, style: ghost, external: true }
  slideshow:
    - images/hero-screenshot.svg
    # Add more screenshots here — one per Stashix feature/screen
  media:
    ratio: 1fr 1fr
    hide_below: lg
    max_width: 560px

cards:
  eyebrow: Everything you need
  title: Ship your own shelf
  columns: 3
  items:
    - title: User Guide
      desc: Browse your library, read comics and ebooks in the browser, manage your account.
      icon: fa-solid fa-book-open
      url: docs/
    - title: Admin Guide
      desc: Set up libraries, manage users, configure permissions and age-gate controls.
      icon: fa-solid fa-screwdriver-wrench
      url: docs/
    - title: Release Notes
      desc: Stay up to date with new features, fixes, and breaking changes.
      icon: fa-solid fa-bullhorn
      url: blog/

cta:
  title: Ready to run Stashix?
  text: Deploy with Docker in minutes. Bring your own CBZ, CBR, PDF, or EPUB collection.
  label: Get started
  url: docs/get-started/
  style: primary
