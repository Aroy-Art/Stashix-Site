title: &siteTitle Stashix
baseURL: https://stashix.net/
defaultContentLanguage: en
enableGitInfo: false
enableRobotsTXT: true
enableEmoji: true
timeZone: UTC

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: *siteTitle
    params:
      description: Free, open-source, self-hosted comic and manga library. Read CBZ, CBR and CB7 in your browser, plus PDF and EPUB as page images, with automatic metadata matching.

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  offline_search: true
  copyright:
    authors: Stashix contributors
    from_year: 2024
  footer_center_info: ''
  ui:
    preset: ink
    preset_menu: [ink]
    dark_mode: true
    section_index: cards
    blog_index: cards
    sidebar_menu_foldable: true
    sidebar_icon_policy: groups
    backlinks: true
    theme_color: '#7c3aed'

  # This site's repo: page "Edit this page" / "View page source" links.
  github_repo: https://github.com/Aroy-Art/Stashix-Site
  github_branch: main
  # The app's repo: navbar GitHub link and JSON-LD codeRepository/sameAs.
  github_project_repo: https://github.com/aroy-art/stashix

  logo: icons/logo.svg

  # Default link-preview image (og:image / twitter:image) for pages without
  # their own `images` front matter.
  images: [images/hero/hero-home.png]
  images_alt: Stashix home screen with a continue-reading banner and rows of comic covers

module:
  imports:
    - path: github.com/pgsty/oink
  mounts:
    # Declaring any assets mount drops the default one, so restate it.
    - { source: assets, target: assets }
    # Hero slides: processed into resized WebP by the landing hero partial.
    - { source: static/images/hero, target: assets/images/hero }
  hugoVersion:
    extended: true
    min: 0.166.0

# Remote downloads (the app's CHANGELOG.md for /blog/release/, GitHub stars)
# are cached; refresh them hourly so new releases show up without clearing
# the cache by hand.
caches:
  getresource:
    maxAge: 1h
