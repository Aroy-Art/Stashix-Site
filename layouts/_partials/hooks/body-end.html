<script>
(function () {
  var slides = document.querySelectorAll('.td-hero-slide');
  if (slides.length < 2) return;
  var current = 0;
  setInterval(function () {
    slides[current].classList.remove('td-hero-slide--active');
    current = (current + 1) % slides.length;
    slides[current].classList.add('td-hero-slide--active');
  }, 4000);
}());
</script>
<script>
(function () {
  document.addEventListener('click', function (event) {
    var button = event.target.closest('[data-sx-notice-close]');
    if (!button) return;
    var notice = button.closest('[data-sx-notice]');
    notice.hidden = true;
    try { localStorage.setItem('sx-notice-dismissed', notice.dataset.sxNotice); } catch (e) {}
  });
}());
</script>
